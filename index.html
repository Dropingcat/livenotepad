      });
      downloadJSON(data, 'livenotepad-notes');
      Audit.log({ type: 'EXPORT', source: 'export', result: 'ok', counts: { notes: data.counts.notes }, mode: 'notes' });
      toast(`Экспортировано ${data.counts.notes} заметок`);
    } catch (e) { Audit.error('export', e, { action: 'exportNotes' }); toast('Ошибка: ' + e.message); }
  }

  const exportLearning = async () => {
    try {
      const snapshot = await DB.getSnapshot();
      const data = buildExport({
        mode: 'learning',
        dbSnapshot: snapshot,
        appVersion: APP_VERSION,
        deviceId: getOrCreateDeviceId(auditStorage()),
        sessionId: Audit.meta.sessionId
      });
      downloadJSON(data, 'livenotepad-learning');
      Audit.log({ type: 'EXPORT', source: 'export', result: 'ok', counts: { evidence: data.counts.evidence, meta: data.counts.meta }, mode: 'learning' });
      toast('Обучение экспортировано');
    } catch (e) { Audit.error('export', e, { action: 'exportLearning' }); toast('Ошибка: ' + e.message); }
  }

  const exportLearningJSONL = async () => {
    try {
      const [evidence, meta] = await Promise.all([DB.getAllEvidence(), DB.getAllMeta()]);
      const metaByStem = {};
      for (const m of meta) { metaByStem[m.stem] = m; }
      const lines = evidence.map(e => {
        const m = metaByStem[e.stem];
        return JSON.stringify({
          ts: e.lastSeenAt || Date.now(),
          type: 'CORRECT',
          stem: e.stem,
          branch: e.branch,
          evidence: e.evidence,
          distinctNotes: e.distinctNotes || 0,
          noteIds: e.noteIds || [],
          lastSeenAt: e.lastSeenAt || 0,
          state: m ? m.state : 'CANDIDATE',
          userCurated: m ? (m.userCurated || false) : false
        });
      }).join('\n');
      const blob = new Blob([lines], { type: 'application/jsonl' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `livenotepad-learning-jsonl-${stamp}.jsonl`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ } }, 1000);
      Audit.log({ type: 'EXPORT', source: 'export', result: 'ok', counts: { evidence: evidence.length, meta: meta.length }, mode: 'jsonl' });
      toast(`JSONL экспортирован: ${evidence.length} строк`);
    } catch (e) { Audit.error('export', e, { action: 'exportLearningJSONL' }); toast('Ошибка: ' + e.message); }
  }

  const exportLogs = async () => {
    try {
      const snapshot = await DB.getSnapshot();
      const data = buildExport({
        mode: 'logs',
        dbSnapshot: snapshot,
        appVersion: APP_VERSION,
        deviceId: getOrCreateDeviceId(auditStorage()),
        sessionId: Audit.meta.sessionId
      });
      downloadJSON(data, 'livenotepad-logs');
      Audit.log({ type: 'EXPORT', source: 'export', result: 'ok', counts: { logs: data.counts.logs }, mode: 'logs' });
      toast(`Экспортировано ${data.counts.logs} записей`);
    } catch (e) { Audit.error('export', e, { action: 'exportLogs' }); toast('Ошибка: ' + e.message); }
  }

  return { open, close, setTab, renderTab };
})();

// ── Смена дня: полночь и возврат в приложение ──────────────────────────────
let lastDay = startOfDay(Date.now());
let midnightTimer = null;

async function onDayRollover(showToast = false) {
  const today = startOfDay(Date.now());
  if (today === lastDay) return false;
  lastDay = today;
  await render();
  if (showToast) toast('Новый лист');
  return true;
}

function scheduleMidnight() {
  clearTimeout(midnightTimer);
  const delay = Math.max(1000, nextMidnight(Date.now()) - Date.now());
  midnightTimer = setTimeout(async () => {
    try {
      const rolled = await onDayRollover(true);
      if (rolled) Audit.log({ type: 'MIDNIGHT', source: 'system', result: 'ok', details: { day: startOfDay(Date.now()) } });
    }
    catch (e) { console.error('midnight rollover:', e); Audit.error('render', e, { action: 'midnightRollover' }); }
    finally { scheduleMidnight(); }
  }, delay);
}
scheduleMidnight();

const intervalId = setInterval(async () => {
  try {
    const rolled = await onDayRollover(false);
    if (!rolled) await render();
  } catch (e) { console.error('render tick:', e); Audit.error('render', e, { action: 'renderTick' }); }
}, 60000);

async function onResume() {
  try {
    await onDayRollover(false);
    await render();
    scheduleMidnight();
  } catch (e) { console.error('resume:', e); Audit.error('window', e, { action: 'resume' }); }
}

});
